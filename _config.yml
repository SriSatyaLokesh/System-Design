# Site settings
title: "Agentic AI Learning Pathway"
description: "A curated learning pathway for mastering AI assistants, agents, and copilots"
baseurl: ""
url: "http://localhost:4000"

# Theme (using local gem)
theme: just-the-docs

# Plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Markdown
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

# Just the Docs configuration
search_enabled: true
heading_anchors: true

# Navigation structure
nav_sort: case_insensitive

# Footer
footer_content: "Part of the GSD Framework project"

# Color scheme
color_scheme: light

# Exclude from processing
exclude:
  - .gsd/
  - .github/
  - .git/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/
  - "*.backup.md"
  - Caching/
  - Code Bibles/
  - Node JS/
  - Notification Systems/
  - System Design bibles/

# Include only Agentic AI content
include:
  - "Agentic AI/"
